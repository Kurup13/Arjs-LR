<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR - 4 Movie Posters</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: monospace; }

    /* Loading screen */
    #loading {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      background: #000; color: #0ff;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 9999;
    }
    .spinner {
      width: 50px; height: 50px;
      border: 4px solid #0ff3;
      border-top-color: #0ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .load-title { font-size: 20px; letter-spacing: 3px; margin-bottom: 20px; }
    .status { font-size: 13px; color: #555; margin: 4px 0; transition: color 0.4s; }
    .status.done { color: #0f0; }

    /* Badges bottom bar */
    #badges {
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 10px 12px;
      background: linear-gradient(transparent, rgba(0,0,0,0.8));
      display: flex; justify-content: space-around;
      z-index: 1000;
    }
    .badge {
      display: flex; align-items: center; gap: 6px;
      background: rgba(0,0,0,0.6);
      border: 1px solid #333; border-radius: 16px;
      padding: 5px 12px; font-size: 11px; color: #888;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #333; }
    .badge.active .dot { background: #0f0; box-shadow: 0 0 5px #0f0; }
    .badge.active { color: #fff; border-color: #0f06; }

    /* Distance box */
    #distBox {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.75); border: 1px solid #0ff4;
      border-radius: 10px; padding: 8px 18px;
      color: #0ff; font-size: 13px; text-align: center;
      z-index: 1000; display: none;
    }
    #distBox .num { font-size: 26px; font-weight: bold; color: #fff; }
  </style>
</head>
<body>

  <!-- Loading -->
  <div id="loading">
    <div class="spinner"></div>
    <div class="load-title">LOADING MARKERS</div>
    <div class="status" id="s1">&#9634; WALL-E</div>
    <div class="status" id="s2">&#9634; RON'S GONE WRONG</div>
    <div class="status" id="s3">&#9634; STRANGE WORLD</div>
    <div class="status" id="s4">&#9634; TOY STORY</div>
  </div>

  <!-- Distance -->
  <div id="distBox">
    <div style="font-size:10px; color:#888; letter-spacing:2px;">DISTANCE</div>
    <div class="num"><span id="distVal">--</span> m</div>
    <div id="distNames" style="font-size:10px; color:#888;"></div>
  </div>

  <!-- Badges -->
  <div id="badges">
    <div class="badge" id="b1"><div class="dot"></div> WALL-E</div>
    <div class="badge" id="b2"><div class="dot"></div> RON</div>
    <div class="badge" id="b3"><div class="dot"></div> STRANGE</div>
    <div class="badge" id="b4"><div class="dot"></div> TOY STORY</div>
  </div>

  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;"
    renderer="logarithmicDepthBuffer: true; antialias: true;"
    vr-mode-ui="enabled: false">

    <a-assets>
      <video id="vid"
        src="https://www.w3schools.com/html/mov_bbb.mp4"
        autoplay loop muted playsinline crossorigin="anonymous">
      </video>
    </a-assets>

    <!-- ══════════════════════════════════════════
         MARKER 1: WALL-E  (cyan / green theme)
    ══════════════════════════════════════════════ -->
    <a-nft id="mWalle" type="nft"
      url="https://kurup13.github.io/Arjs-LR/WALL-E"
      emitevents="true" smooth="true"
      smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">

      <a-entity scale="50 50 50">

        <!-- Ground ring -->
        <a-torus position="0 0.02 0" rotation="-90 0 0"
          radius="2" radius-tubular="0.05" color="#00ffff"
          material="emissive:#00ffff; emissiveIntensity:0.7; opacity:0.5; transparent:true"
          animation="property:rotation; from:-90 0 0; to:-90 360 0; loop:true; dur:4000; easing:linear">
        </a-torus>

        <!-- Pulse ring -->
        <a-torus position="0 0.05 0" rotation="-90 0 0"
          radius="0.3" radius-tubular="0.04" color="#00ffff"
          material="emissive:#00ffff; emissiveIntensity:1; opacity:0.8; transparent:true"
          animation__s="property:scale; from:1 1 1; to:6 6 6; loop:true; dur:2000; easing:easeOutQuad"
          animation__o="property:material.opacity; from:0.8; to:0; loop:true; dur:2000; easing:easeOutQuad">
        </a-torus>

        <!-- Main sphere -->
        <a-sphere position="0 1.5 0" radius="0.9"
          material="color:#00ff88; emissive:#00ff44; emissiveIntensity:0.6; metalness:0.4; roughness:0.1; transparent:true; opacity:0.93"
          animation__bob="property:position; from:0 1.3 0; to:0 1.8 0; dir:alternate; loop:true; dur:1800; easing:easeInOutSine"
          animation__glow="property:material.emissiveIntensity; from:0.4; to:1; dir:alternate; loop:true; dur:1200">
        </a-sphere>

        <!-- Orbit ring 1 -->
        <a-entity position="0 1.5 0"
          animation="property:rotation; to:0 360 0; loop:true; dur:3000; easing:linear">
          <a-torus radius="1.4" radius-tubular="0.05" rotation="20 0 0"
            material="color:#00ffcc; emissive:#00ffcc; emissiveIntensity:0.6; opacity:0.6; transparent:true">
          </a-torus>
        </a-entity>

        <!-- Orbit ring 2 -->
        <a-entity position="0 1.5 0"
          animation="property:rotation; to:360 0 0; loop:true; dur:2500; easing:linear">
          <a-torus radius="1.2" radius-tubular="0.04" rotation="0 0 60"
            material="color:#00ff44; emissive:#00ff44; emissiveIntensity:0.5; opacity:0.5; transparent:true">
          </a-torus>
        </a-entity>

        <!-- Label -->
        <a-text value="WALL-E" position="0 3.2 0" align="center"
          color="#00ffcc" width="8"
          animation="property:scale; from:1 1 1; to:1.08 1.08 1.08; dir:alternate; loop:true; dur:1500">
        </a-text>

        <!-- Video screen -->
        <a-entity position="0 5.5 0">
          <a-plane width="4.4" height="3.4" color="#00ffcc"
            material="emissive:#00ffcc; emissiveIntensity:0.3; opacity:0.4; transparent:true">
          </a-plane>
          <a-video src="#vid" width="4" height="3" position="0 0 0.01"></a-video>
          <a-text value="LIVE FEED" position="0 -2.1 0" align="center"
            color="#00ffcc" width="5" scale="0.7 0.7 0.7">
          </a-text>
        </a-entity>

      </a-entity>
    </a-nft>

    <!-- ══════════════════════════════════════════
         MARKER 2: RON'S GONE WRONG  (orange / gold)
    ══════════════════════════════════════════════ -->
    <a-nft id="mRon" type="nft"
      url="https://kurup13.github.io/Arjs-LR/RON"
      emitevents="true" smooth="true"
      smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">

      <a-entity scale="50 50 50">

        <!-- Ground ring -->
        <a-torus position="0 0.02 0" rotation="-90 0 0"
          radius="2" radius-tubular="0.05" color="#ff8800"
          material="emissive:#ff8800; emissiveIntensity:0.7; opacity:0.5; transparent:true"
          animation="property:rotation; from:-90 0 0; to:-90 -360 0; loop:true; dur:4000; easing:linear">
        </a-torus>

        <!-- Pulse ring -->
        <a-torus position="0 0.05 0" rotation="-90 0 0"
          radius="0.3" radius-tubular="0.04" color="#ff8800"
          material="emissive:#ff8800; emissiveIntensity:1; opacity:0.8; transparent:true"
          animation__s="property:scale; from:1 1 1; to:6 6 6; loop:true; dur:2000; easing:easeOutQuad"
          animation__o="property:material.opacity; from:0.8; to:0; loop:true; dur:2000; easing:easeOutQuad">
        </a-torus>

        <!-- Main cylinder -->
        <a-cylinder position="0 1.2 0" radius="0.7" height="2"
          material="color:#FFA500; emissive:#ff6600; emissiveIntensity:0.6; metalness:0.5; roughness:0.2; transparent:true; opacity:0.93"
          animation__bob="property:position; from:0 1.0 0; to:0 1.5 0; dir:alternate; loop:true; dur:1600; easing:easeInOutSine"
          animation__glow="property:material.emissiveIntensity; from:0.4; to:1; dir:alternate; loop:true; dur:1000"
          animation__spin="property:rotation; to:0 360 0; loop:true; dur:5000; easing:linear">
        </a-cylinder>

        <!-- Gold orbiting sphere -->
        <a-entity position="0 1.2 0"
          animation="property:rotation; to:0 360 0; loop:true; dur:2000; easing:linear">
          <a-sphere position="1.8 0 0" radius="0.35"
            material="color:#FFD700; emissive:#FFD700; emissiveIntensity:0.8; metalness:0.9; roughness:0.1">
          </a-sphere>
        </a-entity>

        <!-- Red counter-orbiting sphere -->
        <a-entity position="0 1.2 0"
          animation="property:rotation; to:0 -360 0; loop:true; dur:1500; easing:linear">
          <a-sphere position="0 1.5 0" radius="0.2"
            material="color:#ff4400; emissive:#ff4400; emissiveIntensity:0.9">
          </a-sphere>
        </a-entity>

        <!-- Label -->
        <a-text value="RON" position="0 3.2 0" align="center"
          color="#FFA500" width="8"
          animation="property:scale; from:1 1 1; to:1.08 1.08 1.08; dir:alternate; loop:true; dur:1500">
        </a-text>

        <!-- Info panel -->
        <a-entity position="0 5.5 0">
          <a-plane width="4" height="2.5" color="#ff8800"
            material="emissive:#ff4400; emissiveIntensity:0.2; opacity:0.5; transparent:true">
          </a-plane>
          <a-text value="RON B*Bot&#10;Your AI&#10;Best Friend"
            position="0 0 0.05" align="center" color="#fff" width="6">
          </a-text>
        </a-entity>

      </a-entity>
    </a-nft>

    <!-- ══════════════════════════════════════════
         MARKER 3: STRANGE WORLD  (purple / magenta)
         Generate descriptors and update URL below
    ══════════════════════════════════════════════ -->
    <a-nft id="mStrange" type="nft"
      url="https://kurup13.github.io/Arjs-LR/STRANGE-WORLD"
      emitevents="true" smooth="true"
      smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">

      <a-entity scale="50 50 50">

        <!-- Ground ring -->
        <a-torus position="0 0.02 0" rotation="-90 0 0"
          radius="2" radius-tubular="0.05" color="#cc00ff"
          material="emissive:#cc00ff; emissiveIntensity:0.7; opacity:0.5; transparent:true"
          animation="property:rotation; from:-90 0 0; to:-90 360 0; loop:true; dur:5000; easing:linear">
        </a-torus>

        <!-- Pulse ring -->
        <a-torus position="0 0.05 0" rotation="-90 0 0"
          radius="0.3" radius-tubular="0.04" color="#ff00cc"
          material="emissive:#ff00cc; emissiveIntensity:1; opacity:0.8; transparent:true"
          animation__s="property:scale; from:1 1 1; to:7 7 7; loop:true; dur:2500; easing:easeOutQuad"
          animation__o="property:material.opacity; from:0.8; to:0; loop:true; dur:2500; easing:easeOutQuad">
        </a-torus>

        <!-- Wireframe icosahedron -->
        <a-icosahedron position="0 1.5 0" radius="1"
          material="color:#cc44ff; emissive:#8800cc; emissiveIntensity:0.6; wireframe:true"
          animation__spin="property:rotation; to:360 360 0; loop:true; dur:6000; easing:linear"
          animation__bob="property:position; from:0 1.2 0; to:0 1.8 0; dir:alternate; loop:true; dur:2000; easing:easeInOutSine">
        </a-icosahedron>

        <!-- Inner solid sphere -->
        <a-sphere position="0 1.5 0" radius="0.6"
          material="color:#ff44cc; emissive:#cc0088; emissiveIntensity:0.5; transparent:true; opacity:0.8"
          animation="property:material.emissiveIntensity; from:0.3; to:0.9; dir:alternate; loop:true; dur:1400">
        </a-sphere>

        <!-- Orbiting boxes -->
        <a-entity position="0 1.5 0"
          animation="property:rotation; to:0 360 0; loop:true; dur:3500; easing:linear">
          <a-box position="2 0 0" width="0.4" height="0.4" depth="0.4"
            material="color:#ff00aa; emissive:#ff00aa; emissiveIntensity:0.8">
          </a-box>
        </a-entity>
        <a-entity position="0 1.5 0"
          animation="property:rotation; to:0 -360 0; loop:true; dur:2800; easing:linear">
          <a-box position="0 0 1.8" width="0.3" height="0.3" depth="0.3"
            material="color:#aa00ff; emissive:#aa00ff; emissiveIntensity:0.8">
          </a-box>
        </a-entity>

        <!-- Label -->
        <a-text value="STRANGE WORLD" position="0 3.4 0" align="center"
          color="#ff44cc" width="9"
          animation="property:scale; from:1 1 1; to:1.08 1.08 1.08; dir:alternate; loop:true; dur:1500">
        </a-text>

        <!-- Info panel -->
        <a-entity position="0 5.5 0">
          <a-plane width="5" height="2.5" color="#8800cc"
            material="emissive:#cc00ff; emissiveIntensity:0.2; opacity:0.5; transparent:true">
          </a-plane>
          <a-text value="Explore the&#10;Strange World"
            position="0 0 0.05" align="center" color="#fff" width="7">
          </a-text>
        </a-entity>

      </a-entity>
    </a-nft>

    <!-- ══════════════════════════════════════════
         MARKER 4: TOY STORY  (yellow / blue theme)
         Generate descriptors and update URL below
    ══════════════════════════════════════════════ -->
    <a-nft id="mToy" type="nft"
      url="https://kurup13.github.io/Arjs-LR/TOY-STORY"
      emitevents="true" smooth="true"
      smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">

      <a-entity scale="50 50 50">

        <!-- Ground ring -->
        <a-torus position="0 0.02 0" rotation="-90 0 0"
          radius="2" radius-tubular="0.05" color="#ffdd00"
          material="emissive:#ffdd00; emissiveIntensity:0.7; opacity:0.5; transparent:true"
          animation="property:rotation; from:-90 0 0; to:-90 -360 0; loop:true; dur:3500; easing:linear">
        </a-torus>

        <!-- Pulse ring -->
        <a-torus position="0 0.05 0" rotation="-90 0 0"
          radius="0.3" radius-tubular="0.04" color="#ffdd00"
          material="emissive:#ffdd00; emissiveIntensity:1; opacity:0.8; transparent:true"
          animation__s="property:scale; from:1 1 1; to:6 6 6; loop:true; dur:2000; easing:easeOutQuad"
          animation__o="property:material.opacity; from:0.8; to:0; loop:true; dur:2000; easing:easeOutQuad">
        </a-torus>

        <!-- Woody body (cylinder) -->
        <a-cylinder position="0 0.8 0" radius="0.7" height="1.5"
          material="color:#8B4513; emissive:#5c2d0a; emissiveIntensity:0.4; metalness:0.1"
          animation__bob="property:position; from:0 0.7 0; to:0 1.1 0; dir:alternate; loop:true; dur:1800; easing:easeInOutSine">
        </a-cylinder>

        <!-- Woody hat (cone) -->
        <a-cone position="0 1.9 0" radius-bottom="0.8" radius-top="0.05" height="1"
          material="color:#ffdd00; emissive:#ddaa00; emissiveIntensity:0.5"
          animation__bob="property:position; from:0 1.8 0; to:0 2.2 0; dir:alternate; loop:true; dur:1800; easing:easeInOutSine">
        </a-cone>

        <!-- Buzz wings -->
        <a-entity position="0 1.2 0"
          animation="property:rotation; to:0 360 0; loop:true; dur:8000; easing:linear">
          <a-plane position="2.5 0 0" width="2" height="0.5" rotation="0 0 20"
            material="color:#4488ff; emissive:#2255cc; emissiveIntensity:0.5; transparent:true; opacity:0.8">
          </a-plane>
          <a-plane position="-2.5 0 0" width="2" height="0.5" rotation="0 0 -20"
            material="color:#4488ff; emissive:#2255cc; emissiveIntensity:0.5; transparent:true; opacity:0.8">
          </a-plane>
        </a-entity>

        <!-- Buzz helmet sphere -->
        <a-sphere position="0 3 0" radius="0.7"
          material="color:#88ccff; emissive:#4488cc; emissiveIntensity:0.4; transparent:true; opacity:0.6; metalness:0.8; roughness:0.1"
          animation="property:material.emissiveIntensity; from:0.3; to:0.8; dir:alternate; loop:true; dur:1600">
        </a-sphere>

        <!-- Label -->
        <a-text value="TOY STORY" position="0 4.2 0" align="center"
          color="#ffdd00" width="8"
          animation="property:scale; from:1 1 1; to:1.08 1.08 1.08; dir:alternate; loop:true; dur:1500">
        </a-text>

        <!-- Info panel -->
        <a-entity position="0 6 0">
          <a-plane width="4.5" height="2.5" color="#ffdd00"
            material="emissive:#ddaa00; emissiveIntensity:0.2; opacity:0.5; transparent:true">
          </a-plane>
          <a-text value="To Infinity&#10;and Beyond!"
            position="0 0 0.05" align="center" color="#fff" width="6">
          </a-text>
        </a-entity>

      </a-entity>
    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // ── Marker references ───────────────────────────────────
    const markers = {
      walle:  { el: document.getElementById('mWalle'),   badge: document.getElementById('b1'), name: 'WALL-E',        s: document.getElementById('s1') },
      ron:    { el: document.getElementById('mRon'),     badge: document.getElementById('b2'), name: 'RON',           s: document.getElementById('s2') },
      strange:{ el: document.getElementById('mStrange'), badge: document.getElementById('b3'), name: 'STRANGE WORLD', s: document.getElementById('s3') },
      toy:    { el: document.getElementById('mToy'),     badge: document.getElementById('b4'), name: 'TOY STORY',     s: document.getElementById('s4') },
    };

    const vis    = { walle: false, ron: false, strange: false, toy: false };
    const loaded = { walle: false, ron: false, strange: false, toy: false };

    // ── Loading screen ──────────────────────────────────────
    const loadingEl = document.getElementById('loading');

    function checkAllLoaded() {
      if (Object.values(loaded).every(v => v)) {
        setTimeout(() => { loadingEl.style.display = 'none'; }, 500);
      }
    }
    setTimeout(() => { loadingEl.style.display = 'none'; }, 30000);

    // ── Events ──────────────────────────────────────────────
    for (const [key, m] of Object.entries(markers)) {
      m.el.addEventListener('markerFound', () => { vis[key] = true;  m.badge.classList.add('active'); });
      m.el.addEventListener('markerLost',  () => { vis[key] = false; m.badge.classList.remove('active'); });
      m.el.addEventListener('nft-loaded',  () => {
        loaded[key] = true;
        m.s.textContent = '✅ ' + m.name + ' ready';
        m.s.classList.add('done');
        checkAllLoaded();
      });
    }

    // ── Tap interaction ─────────────────────────────────────
    document.addEventListener('touchstart', handleTap);
    document.addEventListener('click', handleTap);

    function handleTap() {
      const activeNames = Object.keys(vis).filter(k => vis[k]).map(k => markers[k].name);
      if (activeNames.length === 0) return;
      showPopup(activeNames.join(' + '), activeNames.length > 1 ? 'Measuring distance...' : 'Marker detected!');
    }

    function showPopup(title, body) {
      let p = document.getElementById('popup');
      if (!p) {
        p = document.createElement('div');
        p.id = 'popup';
        Object.assign(p.style, {
          position: 'fixed', top: '50%', left: '50%',
          transform: 'translate(-50%,-50%)',
          background: 'rgba(0,0,0,0.88)',
          border: '1px solid #0ff',
          borderRadius: '14px', padding: '20px 28px',
          color: '#fff', fontFamily: 'monospace',
          fontSize: '15px', textAlign: 'center',
          zIndex: '9998', minWidth: '200px',
          boxShadow: '0 0 20px #0ff4'
        });
        document.body.appendChild(p);
      }
      p.innerHTML = `<div style="color:#0ff;font-size:18px;font-weight:bold;margin-bottom:8px">${title}</div>
                     <div style="color:#aaa">${body}</div>
                     <div style="margin-top:12px;font-size:11px;color:#555">auto-closes in 2s</div>`;
      p.style.display = 'block';
      setTimeout(() => { p.style.display = 'none'; }, 2000);
    }

    // ── Distance ────────────────────────────────────────────
    const distBox   = document.getElementById('distBox');
    const distVal   = document.getElementById('distVal');
    const distNames = document.getElementById('distNames');

    function dist3d(a, b) {
      const p = markers[a].el.object3D.position;
      const q = markers[b].el.object3D.position;
      return Math.sqrt(Math.pow(p.x-q.x,2) + Math.pow(p.y-q.y,2) + Math.pow(p.z-q.z,2));
    }

    function updateDistance() {
      const visible = Object.keys(vis).filter(k => vis[k]);
      if (visible.length < 2) { distBox.style.display = 'none'; return; }

      const a = visible[0], b = visible[1];
      const meters = (dist3d(a, b) / 4085).toFixed(3);

      distVal.textContent = meters;
      distNames.textContent = markers[a].name + ' ↔ ' + markers[b].name;
      distBox.style.display = 'block';

      const m = parseFloat(meters);
      distBox.style.borderColor = m < 0.15 ? '#f00' : m < 0.40 ? '#ff0' : '#0ff';
    }

    setInterval(updateDistance, 100);
  </script>
</body>
</html>
