<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR.js NFT Natural Markers</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
  <style>
    .overlay {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      color: #fff;
      padding: 10px 15px;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      z-index: 1000;
    }
  </style>
</head>
<body style="margin: 0; overflow: hidden;">

  <div id="distanceOverlay" class="overlay">
    Distance: <span id="distValue">--</span> m
  </div>

  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;"
    renderer="logarithmicDepthBuffer: true;"
  >
    <!-- WALL-E NFT Marker -->
    <a-nft
      id="markerWalle"
      type="nft"
      url="WALL-E"
      emitevents="true"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
    >
      <a-sphere position="0 0.5 0" color="#00FF00"></a-sphere>
    </a-nft>

    <!-- RON NFT Marker -->
    <a-nft
      id="markerRon"
      type="nft"
      url="RON"
      emitevents="true"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
    >
      <a-cylinder position="0 0.5 0" color="#FFA500"></a-cylinder>
    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const markers = {
      walle: document.getElementById('markerWalle'),
      ron: document.getElementById('markerRon')
    };

    const distSpan = document.getElementById('distValue');
    const visibility = { walle: false, ron: false };

    for (const [name, marker] of Object.entries(markers)) {
      marker.addEventListener('markerFound', () => { visibility[name] = true; });
      marker.addEventListener('markerLost', () => { visibility[name] = false; });
    }

    function getDistance(m1, m2) {
      const p1 = m1.object3D.position;
      const p2 = m2.object3D.position;
      const dx = p1.x - p2.x;
      const dy = p1.y - p2.y;
      const dz = p1.z - p2.z;
      return Math.sqrt(dx*dx + dy*dy + dz*dz);
    }

    function updateDistance() {
      if (visibility.walle && visibility.ron) {
        const dist = getDistance(markers.walle, markers.ron);
        distSpan.textContent = dist.toFixed(3);
      } else {
        distSpan.textContent = "--";
      }
    }

    setInterval(updateDistance, 100);
  </script>
</body>
</html>
