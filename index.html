<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR.js NFT Natural Markers</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
  <style>
    .overlay {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      color: #fff;
      padding: 10px 15px;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      z-index: 1000;
    }

    #loadingOverlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Courier New', monospace;
      font-size: 16px;
      z-index: 9999;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid #444;
      border-top-color: #00FF00;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #statusWalle { color: #aaa; }
    #statusRon   { color: #aaa; }
    .ready { color: #00FF00 !important; }
  </style>
</head>
<body style="margin: 0; overflow: hidden;">

  <!-- Loading Screen -->
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <p>Loading NFT Markers...</p>
    <p id="statusWalle">⏳ WALL-E marker loading...</p>
    <p id="statusRon">⏳ RON marker loading...</p>
  </div>

  <div id="distanceOverlay" class="overlay">
    Distance: <span id="distValue">--</span> m
  </div>

  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;"
    renderer="logarithmicDepthBuffer: true;"
  >
    <!-- WALL-E NFT Marker -->
    <a-nft
      id="markerWalle"
      type="nft"
      url="WALL-E"
      emitevents="true"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
    >
      <a-sphere position="0 0 0" radius="0.5" color="#00FF00"></a-sphere>
    </a-nft>

    <!-- RON NFT Marker -->
    <a-nft
      id="markerRon"
      type="nft"
      url="RON"
      emitevents="true"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
    >
      <a-cylinder position="0 0 0" radius="0.5" height="1" color="#FFA500"></a-cylinder>
    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const markers = {
      walle: document.getElementById('markerWalle'),
      ron: document.getElementById('markerRon')
    };

    const distSpan = document.getElementById('distValue');
    const visibility = { walle: false, ron: false };
    const loaded = { walle: false, ron: false };

    // Loading status indicators
    const statusWalle = document.getElementById('statusWalle');
    const statusRon   = document.getElementById('statusRon');
    const loadingOverlay = document.getElementById('loadingOverlay');

    // Detect when NFT descriptors are loaded
    markers.walle.addEventListener('nft-loaded', () => {
      loaded.walle = true;
      statusWalle.textContent = '✅ WALL-E marker ready!';
      statusWalle.classList.add('ready');
      checkAllLoaded();
    });

    markers.ron.addEventListener('nft-loaded', () => {
      loaded.ron = true;
      statusRon.textContent = '✅ RON marker ready!';
      statusRon.classList.add('ready');
      checkAllLoaded();
    });

    function checkAllLoaded() {
      if (loaded.walle && loaded.ron) {
        setTimeout(() => {
          loadingOverlay.style.display = 'none';
        }, 500);
      }
    }

    // Fallback: hide loading after 30 seconds no matter what
    setTimeout(() => {
      loadingOverlay.style.display = 'none';
    }, 30000);

    for (const [name, marker] of Object.entries(markers)) {
      marker.addEventListener('markerFound', () => { visibility[name] = true; });
      marker.addEventListener('markerLost',  () => { visibility[name] = false; });
    }

    function getDistance(m1, m2) {
      const p1 = m1.object3D.position;
      const p2 = m2.object3D.position;
      const dx = p1.x - p2.x;
      const dy = p1.y - p2.y;
      const dz = p1.z - p2.z;
      return Math.sqrt(dx*dx + dy*dy + dz*dz);
    }

    function updateDistance() {
      if (visibility.walle && visibility.ron) {
        const dist = getDistance(markers.walle, markers.ron);
        distSpan.textContent = dist.toFixed(3);
      } else {
        distSpan.textContent = "--";
      }
    }

    setInterval(updateDistance, 100);
  </script>
</body>
</html>
