<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR Interactive NFT</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: 'Courier New', monospace; }

    #loadingOverlay {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      background: #000;
      color: #0ff;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 9999;
    }
    .spinner {
      width: 60px; height: 60px;
      border: 4px solid #0ff3;
      border-top-color: #0ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .load-title { font-size: 22px; color: #0ff; letter-spacing: 4px; margin-bottom: 10px; }
    .load-sub   { font-size: 13px; color: #888; margin-bottom: 20px; }
    .status-item { font-size: 14px; color: #555; margin: 5px 0; transition: color 0.5s; }
    .status-item.ready { color: #0f0; }

    #ui {
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 12px 16px;
      background: linear-gradient(transparent, rgba(0,0,0,0.85));
      display: flex; justify-content: space-between; align-items: flex-end;
      z-index: 1000;
    }
    .marker-badge {
      display: flex; align-items: center; gap: 8px;
      background: rgba(0,0,0,0.6);
      border: 1px solid #333; border-radius: 20px;
      padding: 6px 14px; font-size: 12px; color: #aaa;
    }
    .marker-badge .dot { width: 10px; height: 10px; border-radius: 50%; background: #333; transition: background 0.3s; }
    .marker-badge.active .dot { background: #0f0; box-shadow: 0 0 6px #0f0; }
    .marker-badge.active { color: #fff; border-color: #0f04; }

    #distBox {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.75);
      border: 1px solid #0ff4;
      border-radius: 12px; padding: 10px 20px;
      color: #0ff; font-size: 14px; text-align: center;
      z-index: 1000; display: none;
    }
    #distBox .dist-num { font-size: 28px; font-weight: bold; color: #fff; }
    #distBox .dist-label { font-size: 11px; color: #888; letter-spacing: 2px; margin-top: 2px; }

    #tapHint {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: #fff8; font-size: 13px; pointer-events: none;
      z-index: 1000; text-align: center; display: none;
    }
  </style>
</head>
<body>

  <!-- Loading Screen -->
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <div class="load-title">AR SCANNER</div>
    <div class="load-sub">Initializing markers...</div>
    <div class="status-item" id="s1">⬜ WALL-E marker</div>
    <div class="status-item" id="s2">⬜ RON marker</div>
  </div>

  <!-- Distance Box -->
  <div id="distBox">
    <div class="dist-label">DISTANCE</div>
    <div class="dist-num"><span id="distVal">--</span> m</div>
    <div class="dist-label" id="distHint">between markers</div>
  </div>

  <!-- Tap Hint -->
  <div id="tapHint">TAP a shape to interact</div>

  <!-- Bottom UI -->
  <div id="ui">
    <div class="marker-badge" id="badgeWalle">
      <div class="dot"></div> WALL-E
    </div>
    <div class="marker-badge" id="badgeRon">
      <div class="dot"></div> RON
    </div>
  </div>

  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;"
    renderer="logarithmicDepthBuffer: true; antialias: true;"
    vr-mode-ui="enabled: false"
  >
    <a-assets>
      <video id="sampleVideo"
        src="https://www.w3schools.com/html/mov_bbb.mp4"
        autoplay loop muted playsinline crossorigin="anonymous">
      </video>
    </a-assets>

    <!-- ══════════════ WALL-E MARKER ══════════════ -->
    <a-nft id="markerWalle" type="nft"
      url="https://kurup13.github.io/Arjs-LR/WALL-E"
      emitevents="true" smooth="true"
      smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">

      <a-entity scale="50 50 50">

        <!-- Holographic base ring on ground -->
        <a-torus position="0 0.02 0" rotation="-90 0 0"
          radius="2" radius-tubular="0.04" color="#00ffff"
          material="emissive: #00ffff; emissiveIntensity: 0.8; opacity: 0.5; transparent: true"
          animation="property: rotation; from: -90 0 0; to: -90 360 0; loop: true; dur: 4000; easing: linear">
        </a-torus>

        <!-- Expanding scan pulse -->
        <a-torus position="0 0.05 0" rotation="-90 0 0"
          radius="0.3" radius-tubular="0.03" color="#00ffff"
          material="emissive: #00ffff; emissiveIntensity: 1; opacity: 0.9; transparent: true"
          animation__scale="property: scale; from: 1 1 1; to: 6 6 6; loop: true; dur: 2000; easing: easeOutQuad"
          animation__opacity="property: material.opacity; from: 0.9; to: 0; loop: true; dur: 2000; easing: easeOutQuad">
        </a-torus>

        <!-- Main glowing sphere -->
        <a-sphere id="walleSphere" position="0 1.5 0" radius="0.9"
          material="color: #00ff88; emissive: #00ff44; emissiveIntensity: 0.6; metalness: 0.4; roughness: 0.1; transparent: true; opacity: 0.92"
          animation__bob="property: position; from: 0 1.3 0; to: 0 1.8 0; dir: alternate; loop: true; dur: 1800; easing: easeInOutSine"
          animation__glow="property: material.emissiveIntensity; from: 0.4; to: 1; dir: alternate; loop: true; dur: 1200"
          class="clickable" cursor-listener="label: WALL·E; info: Waste Allocation\nLoad Lifter Earth-class; color: #00ff88">
        </a-sphere>

        <!-- Orbiting ring around sphere -->
        <a-entity position="0 1.5 0"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 3000; easing: linear">
          <a-torus radius="1.4" radius-tubular="0.05" rotation="20 0 0"
            material="color: #00ffcc; emissive: #00ffcc; emissiveIntensity: 0.7; opacity: 0.6; transparent: true">
          </a-torus>
        </a-entity>

        <!-- Second orbiting ring (different axis) -->
        <a-entity position="0 1.5 0"
          animation="property: rotation; to: 360 0 0; loop: true; dur: 2500; easing: linear">
          <a-torus radius="1.2" radius-tubular="0.04" rotation="0 0 60"
            material="color: #00ff44; emissive: #00ff44; emissiveIntensity: 0.5; opacity: 0.5; transparent: true">
          </a-torus>
        </a-entity>

        <!-- Floating label -->
        <a-text value="WALL·E" position="0 3.2 0" align="center"
          color="#00ffcc" width="8"
          animation__scale="property: scale; from: 1 1 1; to: 1.08 1.08 1.08; dir: alternate; loop: true; dur: 1500">
        </a-text>

        <!-- Video screen floating above -->
        <a-entity position="0 5 0">
          <!-- Screen border -->
          <a-plane width="4.4" height="3.4" color="#00ffcc"
            material="emissive: #00ffcc; emissiveIntensity: 0.3; opacity: 0.4; transparent: true">
          </a-plane>
          <!-- Video plane -->
          <a-video src="#sampleVideo" width="4" height="3" position="0 0 0.01"></a-video>
          <!-- Screen label -->
          <a-text value="LIVE FEED" position="0 -2 0" align="center"
            color="#00ffcc" width="5" scale="0.7 0.7 0.7">
          </a-text>
        </a-entity>

      </a-entity>
    </a-nft>

    <!-- ══════════════ RON MARKER ══════════════ -->
    <a-nft id="markerRon" type="nft"
      url="https://kurup13.github.io/Arjs-LR/RON"
      emitevents="true" smooth="true"
      smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">

      <a-entity scale="50 50 50">

        <!-- Holographic base ring -->
        <a-torus position="0 0.02 0" rotation="-90 0 0"
          radius="2" radius-tubular="0.04" color="#ff8800"
          material="emissive: #ff8800; emissiveIntensity: 0.8; opacity: 0.5; transparent: true"
          animation="property: rotation; from: -90 0 0; to: -90 -360 0; loop: true; dur: 4000; easing: linear">
        </a-torus>

        <!-- Expanding scan pulse -->
        <a-torus position="0 0.05 0" rotation="-90 0 0"
          radius="0.3" radius-tubular="0.03" color="#ff8800"
          material="emissive: #ff8800; emissiveIntensity: 1; opacity: 0.9; transparent: true"
          animation__scale="property: scale; from: 1 1 1; to: 6 6 6; loop: true; dur: 2000; easing: easeOutQuad"
          animation__opacity="property: material.opacity; from: 0.9; to: 0; loop: true; dur: 2000; easing: easeOutQuad">
        </a-torus>

        <!-- Main glowing cylinder -->
        <a-cylinder id="ronCylinder" position="0 1.2 0"
          radius="0.7" height="2"
          material="color: #FFA500; emissive: #ff6600; emissiveIntensity: 0.6; metalness: 0.5; roughness: 0.2; transparent: true; opacity: 0.92"
          animation__bob="property: position; from: 0 1 0; to: 0 1.5 0; dir: alternate; loop: true; dur: 1600; easing: easeInOutSine"
          animation__glow="property: material.emissiveIntensity; from: 0.4; to: 1; dir: alternate; loop: true; dur: 1000"
          animation__spin="property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear"
          class="clickable" cursor-listener="label: RON; info: Friendship\nBot B*Bot; color: #FFA500">
        </a-cylinder>

        <!-- Orbiting golden sphere -->
        <a-entity position="0 1.2 0"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 2000; easing: linear">
          <a-sphere position="1.8 0 0" radius="0.35"
            material="color: #FFD700; emissive: #FFD700; emissiveIntensity: 0.8; metalness: 0.9; roughness: 0.1">
          </a-sphere>
        </a-entity>

        <!-- Second orbiting smaller sphere -->
        <a-entity position="0 1.2 0"
          animation="property: rotation; to: 0 -360 0; loop: true; dur: 1500; easing: linear">
          <a-sphere position="0 1.5 0" radius="0.2"
            material="color: #ff4400; emissive: #ff4400; emissiveIntensity: 0.9">
          </a-sphere>
        </a-entity>

        <!-- Floating label -->
        <a-text value="RON" position="0 3.2 0" align="center"
          color="#FFA500" width="8"
          animation__scale="property: scale; from: 1 1 1; to: 1.08 1.08 1.08; dir: alternate; loop: true; dur: 1500">
        </a-text>

        <!-- Info panel -->
        <a-entity position="0 5 0">
          <a-plane width="4" height="2.5" color="#ff8800"
            material="emissive: #ff4400; emissiveIntensity: 0.2; opacity: 0.5; transparent: true">
          </a-plane>
          <a-text value="RON B*Bot\nYour AI\nBest Friend" position="0 0 0.05"
            align="center" color="#fff" width="6">
          </a-text>
        </a-entity>

      </a-entity>
    </a-nft>

    <a-entity camera></a-entity>

  </a-scene>

  <script>
    // ── Screen tap interaction ─────────────────────────────────
    document.addEventListener('touchstart', handleTap);
    document.addEventListener('click', handleTap);

    function handleTap() {
      if (visibility.walle && visibility.ron) {
        showPopup('WALL·E & RON', 'Both markers detected!\nMeasuring distance...', '#0ff');
      } else if (visibility.walle) {
        showPopup('WALL·E', 'Waste Allocation\nLoad Lifter Earth-class', '#00ff88');
      } else if (visibility.ron) {
        showPopup('RON', 'Friendship Bot\nB*Bot Series 1', '#FFA500');
      }
    }

    // ── Popup ─────────────────────────────────────────────────
    function showPopup(label, info, color) {
      let popup = document.getElementById('popup');
      if (!popup) {
        popup = document.createElement('div');
        popup.id = 'popup';
        Object.assign(popup.style, {
          position: 'fixed', top: '50%', left: '50%',
          transform: 'translate(-50%, -50%)',
          background: 'rgba(0,0,0,0.85)',
          border: '1px solid ' + color,
          borderRadius: '14px', padding: '20px 28px',
          color: '#fff', fontFamily: 'Courier New, monospace',
          fontSize: '15px', textAlign: 'center',
          zIndex: '9998', minWidth: '200px',
          boxShadow: '0 0 20px ' + color + '66'
        });
        document.body.appendChild(popup);
      }
      popup.innerHTML = `
        <div style="color:${color}; font-size:20px; font-weight:bold; margin-bottom:10px">${label}</div>
        <div style="color:#ccc; line-height:1.6">${info.replace(/\\n/g, '<br>')}</div>
        <div style="margin-top:14px; font-size:11px; color:#555">Tap anywhere to close</div>
      `;
      popup.style.display = 'block';
      setTimeout(() => { popup.style.display = 'none'; }, 3000);
    }

    // ── Markers & visibility ───────────────────────────────────
    const markerWalle = document.getElementById('markerWalle');
    const markerRon   = document.getElementById('markerRon');
    const badgeWalle  = document.getElementById('badgeWalle');
    const badgeRon    = document.getElementById('badgeRon');
    const distBox     = document.getElementById('distBox');
    const distVal     = document.getElementById('distVal');
    const distHint    = document.getElementById('distHint');
    const tapHint     = document.getElementById('tapHint');

    const visibility = { walle: false, ron: false };

    markerWalle.addEventListener('markerFound', () => {
      visibility.walle = true;
      badgeWalle.classList.add('active');
      tapHint.style.display = 'block';
    });
    markerWalle.addEventListener('markerLost', () => {
      visibility.walle = false;
      badgeWalle.classList.remove('active');
    });
    markerRon.addEventListener('markerFound', () => {
      visibility.ron = true;
      badgeRon.classList.add('active');
      tapHint.style.display = 'block';
    });
    markerRon.addEventListener('markerLost', () => {
      visibility.ron = false;
      badgeRon.classList.remove('active');
    });

    // ── Loading ────────────────────────────────────────────────
    const s1 = document.getElementById('s1');
    const s2 = document.getElementById('s2');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const loaded = { walle: false, ron: false };

    markerWalle.addEventListener('nft-loaded', () => {
      loaded.walle = true;
      s1.textContent = '✅ WALL-E marker ready';
      s1.classList.add('ready');
      checkLoaded();
    });
    markerRon.addEventListener('nft-loaded', () => {
      loaded.ron = true;
      s2.textContent = '✅ RON marker ready';
      s2.classList.add('ready');
      checkLoaded();
    });
    function checkLoaded() {
      if (loaded.walle && loaded.ron) {
        setTimeout(() => { loadingOverlay.style.display = 'none'; }, 600);
      }
    }
    setTimeout(() => { loadingOverlay.style.display = 'none'; }, 30000);

    // ── Distance ───────────────────────────────────────────────
    function getDistance(m1, m2) {
      const p1 = m1.object3D.position;
      const p2 = m2.object3D.position;
      const dx = p1.x - p2.x;
      const dy = p1.y - p2.y;
      const dz = p1.z - p2.z;
      return Math.sqrt(dx*dx + dy*dy + dz*dz);
    }

    function updateDistance() {
      if (visibility.walle && visibility.ron) {
        const dist = getDistance(markerWalle, markerRon);
        const meters = (dist / 4085).toFixed(3);
        distVal.textContent = meters;
        distBox.style.display = 'block';
        // Color feedback
        const m = parseFloat(meters);
        if (m < 0.15)      distBox.style.borderColor = '#f00';
        else if (m < 0.40) distBox.style.borderColor = '#ff0';
        else               distBox.style.borderColor = '#0ff';
      } else {
        distBox.style.display = 'none';
      }
    }

    setInterval(updateDistance, 100);
  </script>
</body>
</html>
